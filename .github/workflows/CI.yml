name: CI

on:
  pull_request:

concurrency:
  group: "CI-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Builds every image once; the jobs below load them instead of building again.
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      # The images the end-to-end tests start, and the one the unit tests run in.
      E2E: -f docker-compose.yml -f e2e/docker-compose.yml
      DEV: -f docker-compose.yml -f docker-compose.dev.yml --profile test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the images of the end-to-end tests
        run: docker compose $E2E build

      - name: Build the unit tests image
        run: docker compose $DEV build test

      - name: Build the development image
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build

      - name: Build the production image
        run: docker compose -f docker-compose.yml build

      - name: Save the images
        run: |
          images="$(docker compose $E2E config --images | grep -e '^simplex-chat-moderator-bot/') $(docker compose $DEV config --images | grep -e '-test$' || true)"
          docker save $images | gzip -1 > images.tar.gz

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 1
          compression-level: 0

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the images
        uses: actions/download-artifact@v8
        with:
          name: images

      - name: Load the images
        run: docker load -i images.tar.gz

      - name: Run unit tests
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm test

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The approved screenshots are in Git LFS.
          lfs: true

      - name: Download the images
        uses: actions/download-artifact@v8
        with:
          name: images

      - name: Load the images
        run: docker load -i images.tar.gz

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the tests' dependencies
        working-directory: e2e
        run: npm ci

      - name: Type-check the tests
        working-directory: e2e
        run: npx tsc -p .

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test
        env:
          E2E_SKIP_BUILD: 1

      - name: Keep what failed, the screenshots' differences included
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results
          retention-days: 7

      - name: Show the stack's logs
        if: failure()
        run: docker compose -p simplex-chat-moderator-bot-e2e logs --no-color
