<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Moderator — Rules Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="editor.css">
</head>

<body>
    <div class="wrap">
        <header class="phead">
            <div>
                <div class="eyebrow">Rules editor</div>
                <h1>Moderation rules for <a
                        href="https://simplex-directory.asriyan.me/#/bots/63d110f4-9f70-4128-b0e7-5a8958299f96"
                        target="_blank" rel="noopener">Moderator Bot</a></h1>
                <p class="sub" id="instructions"></p>
                <p class="err" id="nobot" hidden>No bot ID found in the URL. Open the link the bot sent you in a direct
                    message — a link opened by hand cannot be applied.</p>
            </div>
            <button class="btn primary" id="apply" hidden>Apply changes</button>
        </header>

        <div class="boot" id="boot">Loading editor…</div>

        <div class="app" id="app" data-view="list" hidden>
            <!-- Every rule at a glance; one tap opens it. On a phone this is the first screen. -->
            <section class="pane master" aria-label="Rules">
                <div class="pane-head">
                    <h2>Rules</h2>
                    <span class="eyebrow tnum" id="count"></span>
                </div>
                <div class="rlist" id="rlist"></div>
                <div class="lfoot">
                    <button class="btn sm" data-op="addrule">+ Add rule</button>
                </div>
            </section>

            <!-- One rule: its condition tree and its actions. -->
            <section class="pane detail" id="detail" aria-label="Rule"></section>
        </div>

        <!-- What the link actually carries: every rule, not just the open one. -->
        <details class="json" id="payload" hidden>
            <summary>JSON sent to the bot <span class="jmeta" id="payload-meta"></span>
                <button class="btn sm ghost jcopy" id="payload-copy" type="button">Copy JSON</button>
            </summary>
            <pre id="payload-json"></pre>
        </details>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script src="editor.js"></script>
</body>

</html>
