# The development stack: the production file, overridden here only where
# development differs, so whatever both share is written once.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# The bot is the dev container (.devcontainer): the toolchain with the
# repository mounted, where the bot is built and run by hand; the web editor is
# served at http://127.0.0.1:8080. The data stays in
# ./simplex-chat-moderator-bot-dev.
# The unit tests run as in CI:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml run --build --rm test
name: simplex-chat-moderator-bot-dev

services:
  smp-client:
    volumes: !override
      - ./simplex-chat-moderator-bot-dev:/opt/simplex-chat-moderator-bot

  bot:
    build:
      target: dev
    image: simplex-chat-moderator-bot/bot-dev:latest
    working_dir: /workspace
    volumes: !override
      - .:/workspace
      - ./simplex-chat-moderator-bot-dev:/opt/simplex-chat-moderator-bot
    command: ["sleep", "infinity"]
    environment:
      - WEBEDITOR_BASE_URL=http://127.0.0.1:8080
      - BOT_DISPLAY_NAME=DEV Moderator Bot

  webeditor:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./webeditor:/usr/share/nginx/html:ro
    restart: unless-stopped

  # The unit tests, in the image CI runs them in; started only by name.
  test:
    profiles: [test]
    build:
      context: .
      target: test
